<title>001 오선, 덧줄, 덧간 모바일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: 한 화면 파스텔 타워 — 위: 이름표 + 계이름 배지 / 가운데: 분홍(덧줄 구역)·연보라(오선)·분홍으로 나뉜 큰 무대에서 얼굴 있는 음표가 오르내림 / 아래: 설명 카드와 통통한 버튼 3개 */
:root{
  --bg:#EFECFF; --dot:#DCD7FB; --card:#FFFFFF;
  --ink:#2E2B63; --ink-2:#55528F; --ink-3:#605C9A;
  --line:#E1DDFA; --line-2:#CDC8F2; --edge:#D3CEF6;
  --primary:#5A56E6; --primary-ink:#4440C8; --primary-soft:#E7E5FF; --primary-edge:#3A36B5; --on-primary:#FFFFFF;
  --pink:#FF6FA8; --pink-strong:#D6256F; --pink-ink:#BE1F68; --pink-soft:#FFE6F1; --on-pink:#FFFFFF;
  --zone:#FFEAF3; --floor:#F4F2FF; --band-in:#DAD6FF; --band-out:#FFCBE0;
  --staff-line:#2E2B63;
  --pill-in:#FFFFFF; --pill-in-ink:#55528F; --pill-out:#FFFFFF; --pill-out-ink:#BE1F68; --pill-line:rgba(46,43,99,.1);
  --note-in:#5A56E6; --note-out:#DE2A76; --pupil:#2E2B63; --blush:#FFC2DB; --mouth-dark:#2E2B63;
  --glow-in:rgba(90,86,230,.17); --glow-out:rgba(222,42,118,.17);
  --mark:#FFE98A; --butter:#FFD76A; --star:#FFC93C; --badge-ink:#2E2B63;
  --shadow:rgba(70,64,190,.2); --focus:#5A56E6;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1840; --dot:#26235A; --card:#252259;
    --ink:#F3F1FF; --ink-2:#C9C5F5; --ink-3:#A7A3E0;
    --line:#38337F; --line-2:#4B47A8; --edge:#121030;
    --primary:#8E8CFF; --primary-ink:#B9B7FF; --primary-soft:#34318A; --primary-edge:#5654C9; --on-primary:#17153A;
    --pink:#FF8DBA; --pink-strong:#FF7DB0; --pink-ink:#FFA9CB; --pink-soft:#4A2650; --on-pink:#2A0F26;
    --zone:#3A2348; --floor:#2B2866; --band-in:#413E9A; --band-out:#6B3A6F;
    --staff-line:#E7E5FF;
    --pill-in:rgba(255,255,255,.08); --pill-in-ink:#D6D3FA; --pill-out:rgba(255,255,255,.08); --pill-out-ink:#FFA9CB; --pill-line:rgba(255,255,255,.12);
    --note-in:#8E8CFF; --note-out:#FF7DB0; --pupil:#2E2B63; --blush:#FFD1E3; --mouth-dark:#2E2B63;
    --glow-in:rgba(142,140,255,.24); --glow-out:rgba(255,125,176,.24);
    --mark:rgba(142,140,255,.4); --butter:#FFD76A; --star:#FFD76A; --badge-ink:#2E2B63;
    --shadow:rgba(0,0,0,.42); --focus:#B9B7FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1840; --dot:#26235A; --card:#252259;
  --ink:#F3F1FF; --ink-2:#C9C5F5; --ink-3:#A7A3E0;
  --line:#38337F; --line-2:#4B47A8; --edge:#121030;
  --primary:#8E8CFF; --primary-ink:#B9B7FF; --primary-soft:#34318A; --primary-edge:#5654C9; --on-primary:#17153A;
  --pink:#FF8DBA; --pink-strong:#FF7DB0; --pink-ink:#FFA9CB; --pink-soft:#4A2650; --on-pink:#2A0F26;
  --zone:#3A2348; --floor:#2B2866; --band-in:#413E9A; --band-out:#6B3A6F;
  --staff-line:#E7E5FF;
  --pill-in:rgba(255,255,255,.08); --pill-in-ink:#D6D3FA; --pill-out:rgba(255,255,255,.08); --pill-out-ink:#FFA9CB; --pill-line:rgba(255,255,255,.12);
  --note-in:#A3A1FF; --note-out:#FF7DB0; --pupil:#2E2B63; --blush:#FFD1E3; --mouth-dark:#2E2B63;
  --glow-in:rgba(163,161,255,.26); --glow-out:rgba(255,125,176,.24);
  --mark:rgba(142,140,255,.4); --butter:#FFD76A; --star:#FFD76A; --badge-ink:#2E2B63;
  --shadow:rgba(0,0,0,.42); --focus:#B9B7FF;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.8px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

.app{position:relative;min-height:100%;max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;display:flex;flex-direction:column;gap:10px}
.app>*:not(.deco){position:relative;z-index:1}
.deco{position:absolute;z-index:0;pointer-events:none;animation:tw 3.4s ease-in-out infinite}
.d-star{top:12px;right:78px;width:15px;height:15px;fill:var(--star)}
.d-star2{top:40px;right:62px;width:9px;height:9px;fill:var(--pink);animation-delay:-1.4s}
.d-note{top:6px;right:96px;width:15px;height:20px;fill:var(--primary);animation-delay:-2.2s}
@keyframes tw{0%,100%{transform:scale(.82);opacity:.5}50%{transform:scale(1.1);opacity:.95}}

/* 머리 */
.top{display:flex;align-items:center;gap:11px}
.num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--on-primary);font:400 23px/1 var(--f-display);display:grid;place-items:center;box-shadow:0 3px 0 var(--primary-edge),0 0 0 3px var(--card)}
.ttl{flex:1 1 auto;min-width:0}
.eyebrow{margin:0;font:400 12.5px/1.25 var(--f-display);color:var(--ink-3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{margin:1px 0 0;font:400 22px/1.15 var(--f-display);color:var(--ink);white-space:nowrap}
.snd{flex:none;appearance:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--edge);display:grid;place-items:center;cursor:pointer;transition:transform .08s,box-shadow .08s}
.snd:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.snd svg{width:22px;height:22px}
.snd[aria-pressed="false"]{color:var(--ink-3);background:var(--primary-soft)}
.sub{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
@media (max-height:780px){.sub{display:none}}

/* 이름표 */
.read{display:flex;align-items:center;gap:12px}
.read-l{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.name{margin:0;font:400 clamp(25px,7.6vw,32px)/1.12 var(--f-display);color:var(--primary-ink);white-space:nowrap;transition:color .2s}
.name.out{color:var(--pink-ink)}
.name span{display:inline-block;background:linear-gradient(transparent 62%,var(--mark) 62% 94%,transparent 94%);padding:0 4px;margin-left:-4px}
.chips{display:flex;gap:6px;flex-wrap:nowrap}
.chip{flex:none;display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:999px;font:400 clamp(11.5px,3.4vw,13px)/1 var(--f-display);background:var(--primary-soft);color:var(--primary-ink);white-space:nowrap;transition:background .2s,color .2s}
.chip.out{background:var(--pink-soft);color:var(--pink-ink)}
.chip.plain{background:transparent;box-shadow:inset 0 0 0 2px var(--line-2);color:var(--ink-2)}
.dir{margin:0;display:flex;align-items:center;gap:5px;min-height:18px;font:400 clamp(12px,3.4vw,13px)/1.2 var(--f-display);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir svg{width:10px;height:10px;flex:none}
.dir.up svg{color:var(--primary)} .dir.dn svg{color:var(--pink-strong)}
.dir.idle{color:var(--ink-3)}
.solf{flex:none;width:68px;height:68px;border-radius:50%;background:var(--sc,#8F9CFF);box-shadow:0 0 0 5px var(--sg,rgba(143,156,255,.4)),0 5px 0 5px rgba(46,43,99,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--badge-ink);transition:background .2s,box-shadow .2s}
.solf-t{font:400 30px/1 var(--f-display)}
.solf-l{font:400 12px/1 var(--f-display);opacity:.75}

/* 무대 */
.stage-card{flex:1 1 auto;min-height:250px;border-radius:30px;border:2px solid var(--line);background:var(--zone);box-shadow:0 6px 0 var(--edge);overflow:hidden;touch-action:none;position:relative}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
.fl-zone{fill:var(--zone)} .fl-staff{fill:var(--floor)}
.tag rect{fill:var(--pink-strong)}
.tag text{fill:var(--on-pink);font-family:var(--f-display)}
#bandg{transition:transform .22s cubic-bezier(.3,1.45,.5,1)}
.band.in{fill:var(--band-in)} .band.out{fill:var(--band-out)}
.stl{stroke:var(--staff-line);stroke-width:2;stroke-linecap:round}
.bar{stroke:var(--staff-line);stroke-width:2.6;stroke-linecap:round}
.clef{fill:var(--staff-line)}
.ghost{stroke:var(--pink);stroke-width:1.8;stroke-dasharray:3 4;stroke-linecap:round;opacity:.9}
.led{stroke:var(--pink-strong);stroke-width:3;stroke-linecap:round;transform:scaleX(0);transform-box:fill-box;transform-origin:center;transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.led.on{transform:scaleX(1)}
.led.cur{stroke-width:4}
.marks{opacity:0;transition:opacity .2s}
.marks.on{opacity:1}
.mk{fill:none;stroke-width:2;stroke-linecap:round}
.mk.st{stroke:var(--primary)} .mk.ld{stroke:var(--pink-strong)}
.lab .labin{transform-box:fill-box;transform-origin:center;transition:transform .24s cubic-bezier(.3,1.7,.5,1)}
.lab rect{fill:var(--pill-in);stroke:var(--pill-line);stroke-width:1}
.lab.out rect{fill:var(--pill-out)}
.lab text{font-family:var(--f-display);fill:var(--pill-in-ink)}
.lab.out text{fill:var(--pill-out-ink)}
.lab.on .labin{transform:scale(1.13)}
.lab.on rect{fill:var(--primary);stroke:none}
.lab.on text{fill:var(--on-primary)}
.lab.out.on rect{fill:var(--pink-strong)}
.lab.out.on text{fill:var(--on-pink)}

.note{cursor:grab;outline:none;transition:transform .17s cubic-bezier(.3,1.5,.5,1)}
.note.grab{cursor:grabbing}
.glow{fill:var(--glow-in);stroke:transparent;stroke-width:3;transition:fill .2s;transform-box:fill-box;transform-origin:center}
.note.out .glow{fill:var(--glow-out)}
.note:focus-visible .glow{stroke:var(--focus)}
.hit{fill:transparent}
.squash{transform-origin:0 0}
.bob{animation:bob 2.8s ease-in-out infinite}
.note.grab .bob{animation-play-state:paused}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.head,.stem{fill:var(--note-in);transition:fill .2s}
.note.out .head,.note.out .stem{fill:var(--note-out)}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.sclera,.shine{fill:#fff}
.pupil{fill:var(--pupil);transform:translate(0px,calc(var(--look,0)*1px));transition:transform .15s}
.blush{fill:var(--blush);opacity:.9}
.eyes.happy{display:none}
.eyes.happy path{fill:none;stroke:#fff;stroke-width:.07;stroke-linecap:round}
.note[data-mood="happy"] .eyes.open{display:none}
.note[data-mood="happy"] .eyes.happy{display:inline}
.mouth{display:none}
.mouth.smile{fill:none;stroke:#fff;stroke-width:.06;stroke-linecap:round}
.mouth.open,.mouth.o{fill:var(--mouth-dark)}
.tongue{fill:var(--pink)}
.note[data-mouth="smile"] .mouth.smile{display:inline}
.note[data-mouth="open"] .mouth.open,.note[data-mouth="open"] .tongue{display:inline}
.note[data-mouth="o"] .mouth.o{display:inline}
.tongue{display:none}
.chev path{fill:none;stroke:var(--primary);stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.note.out .chev path{stroke:var(--pink-strong)}
.chev{transition:opacity .15s}
.chev.up path{animation:nudgeU 1.5s ease-in-out infinite}
.chev.dn path{animation:nudgeD 1.5s ease-in-out infinite}
@keyframes nudgeU{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes nudgeD{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.note.grab .chev,.note.edge-up .chev.up,.note.edge-dn .chev.dn{opacity:0}
.no-anim *{transition:none!important}

.bubble{position:absolute;left:0;top:0;z-index:3;pointer-events:none;white-space:nowrap;max-width:calc(100% - 12px);font:400 16px/1 var(--f-display);padding:10px 14px 9px;border-radius:16px;background:var(--card);color:var(--primary-ink);border:2px solid var(--primary);box-shadow:0 4px 0 var(--edge),0 10px 22px var(--shadow);opacity:0;transform:translateY(6px) scale(.9);transition:opacity .16s,transform .24s cubic-bezier(.3,1.5,.5,1)}
.bubble.show{opacity:1;transform:none}
.bubble.out{color:var(--pink-ink);border-color:var(--pink-strong)}
.bubble.hint.show{animation:bobh 1.7s ease-in-out infinite}
@keyframes bobh{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bubble::after{content:"";position:absolute;left:var(--tx,50%);bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--primary);border-bottom:2px solid var(--primary);border-radius:0 0 4px 0;transform:translateX(-50%) rotate(45deg)}
.bubble.out::after{border-color:var(--pink-strong)}
.bubble.below::after{bottom:auto;top:-8px;transform:translateX(-50%) rotate(225deg)}

/* 설명 + 버튼 */
.panel{border-radius:26px;border:2px solid var(--line);background:var(--card);box-shadow:0 5px 0 var(--edge);padding:14px 14px 15px;display:flex;flex-direction:column;gap:12px}
.explain{margin:0;font-size:15px;line-height:1.62;color:var(--ink);text-wrap:pretty}
.explain b{font:400 1.04em/1 var(--f-display);background:linear-gradient(transparent 58%,var(--mark) 58% 94%,transparent 94%);padding:0 2px}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.btn{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:8px 4px 7px;border-radius:20px;border:2px solid var(--line-2);background:var(--primary-soft);color:var(--primary-ink);font:400 clamp(12.5px,3.7vw,14.5px)/1.15 var(--f-display);box-shadow:0 5px 0 var(--line-2);cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .15s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line-2)}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--primary);border-color:var(--primary-edge);color:var(--on-primary);box-shadow:0 5px 0 var(--primary-edge)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--primary-edge)}
.btn:disabled{opacity:.45;cursor:default}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .deco{opacity:.7}
  .bubble.show{opacity:1;transform:none}
}
</style>

<div class="app" id="app">
  <svg class="deco d-star" viewBox="-1 -1 2 2" aria-hidden="true"><path d="M0 -1C.14 -.34 .34 -.14 1 0C.34 .14 .14 .34 0 1C-.14 .34 -.34 .14 -1 0C-.34 -.14 -.14 -.34 0 -1Z"/></svg>
  <svg class="deco d-star2" viewBox="-1 -1 2 2" aria-hidden="true"><path d="M0 -1C.14 -.34 .34 -.14 1 0C.34 .14 .14 .34 0 1C-.14 .34 -.34 .14 -1 0C-.34 -.14 -.14 -.34 0 -1Z"/></svg>
  <svg class="deco d-note" id="deco-note" aria-hidden="true"><path id="deco-note-p"/></svg>

  <header class="top">
    <span class="num" aria-hidden="true">4</span>
    <div class="ttl">
      <p class="eyebrow">001 · 오선, 덧줄, 덧간</p>
      <h1>한눈에 보는 구조</h1>
    </div>
    <button type="button" class="snd" id="snd" aria-pressed="true" aria-label="소리 켜짐. 누르면 소리를 끕니다">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.6L13 5.2v13.6l-5.4-4.3H4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path id="snd-wave" d="M16.2 8.8c1.2.9 1.9 2 1.9 3.2s-.7 2.3-1.9 3.2M18.9 6.2c1.9 1.6 3 3.4 3 5.8s-1.1 4.2-3 5.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path id="snd-x" d="M16.6 9.6l5 4.8M21.6 9.6l-5 4.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="display:none"/></svg>

  </header>
  <p class="sub">음표를 위아래로 끌어 오선, 덧줄, 덧간의 위치를 살펴보세요.</p>

  <section class="read" aria-label="지금 음표 자리">
    <div class="read-l">
      <p class="name" id="ro-name"><span>둘째 간</span></p>
      <div class="chips" id="ro-chips"></div>
      <p class="dir idle" id="ro-dir">위로 갈수록 높은 소리</p>
    </div>
    <div class="solf" id="ro-badge" aria-hidden="true"><span class="solf-t" id="ro-solf">라</span><span class="solf-l" id="ro-letter">A4</span></div>
  </section>

  <section class="stage-card" id="stage-card">
    <svg id="stage" role="group" aria-label="오선과 덧줄, 덧간. 음표를 위아래로 끌어 움직일 수 있어요."></svg>
    <div class="bubble" id="bubble" aria-hidden="true"></div>
  </section>

  <section class="panel" aria-label="설명">
    <p class="explain" id="ro-exp"></p>
    <div class="btns">
      <button type="button" class="btn" id="up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 15l6.5-6.5 6.5 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>한 자리 위</span></button>
      <button type="button" class="btn" id="down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 9l6.5 6.5L18.5 9" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>한 자리 아래</span></button>
      <button type="button" class="btn primary" id="listen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 5.8v12.4c0 .8.9 1.3 1.6.8l9.1-6.2c.6-.4.6-1.2 0-1.6L9.8 5c-.7-.5-1.6 0-1.6.8z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>다시 듣기</span></button>
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</div>

<script>

const LEDGER_PS = [16, 18, 20, 4, 2, 0];

  '도': ['#FF8A8A', 'rgba(255,138,138,.4)'], '레': ['#FFB067', 'rgba(255,176,103,.4)'], '미': ['#FFD95E', 'rgba(255,217,94,.46)'],
  '파': ['#78DDA0', 'rgba(120,221,160,.42)'], '솔': ['#6CD2F0', 'rgba(108,210,240,.42)'], '라': ['#8F9CFF', 'rgba(143,156,255,.42)'],
  '시': ['#C79BFF', 'rgba(199,155,255,.42)']
};
const ARW_UP = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.8 11 9.2H1z" fill="currentColor"/></svg>';
const ARW_DN = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10.2 11 2.8H1z" fill="currentColor"/></svg>';

const ST = { p: 9, hinted: false, grab: false, happy: false };
let G = null;

/* ---------- 소리: 음악상자 ---------- */
let SOUND = true, AC = null, master = null, voice = null;
function ac() {
  if (!SOUND) return null;
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      AC = new C();
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3;
      master = AC.createGain(); master.gain.value = 0.85;
      master.connect(comp); comp.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch (e) { return null; }
}
function tone(midi, dur, vol) {
  const c = ac(); if (!c) return null;
  const t = c.currentTime + 0.004, f = 440 * Math.pow(2, (midi - 69) / 12);
  const out = c.createGain(); out.connect(master);
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [[1, 1, 1], [2, 0.32, 0.55], [3.01, 0.15, 0.32], [5.04, 0.06, 0.14]].forEach(a => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f * a[0];
    g.gain.setValueAtTime(a[1], t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * a[2]);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur * a[2] + 0.05);
  });
  return {
    stop() {
      try {
        const n = c.currentTime;
        out.gain.cancelScheduledValues(n);
        out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), n);
        out.gain.exponentialRampToValueAtTime(0.0001, n + 0.07);
      } catch (e) {}
    }
  };
}
function play(midi, long) {
  if (voice) voice.stop();
  voice = tone(midi, long ? 1.9 : 0.8, 0.34);
}
function haptic() { try { if (navigator.vibrate) navigator.vibrate(6); } catch (e) {} }

/* ---------- 바깥으로 알리는 이벤트 ---------- */
function emit(type, detail) { try { document.dispatchEvent(new CustomEvent(type, { detail })); } catch (e) {} }
function pub(x) { return { p: x.p, name: x.name, zone: x.zone, kind: x.kind, ledgers: x.ledgers.length, solf: x.solf, letter: x.letter, midi: x.midi }; }

/* ---------- 무대 ---------- */
const svg = $('stage'), card = $('stage-card');
function emOf(s) {
  let e = 0;
  for (const ch of s) e += ch === ' ' ? 0.3 : /[0-9A-Za-z]/.test(ch) ? 0.56 : 1;
  return e;
}
/* 글자 폭: 실제로 쓰이는 글꼴로 재서(캔버스), 못 재면 어림값 */
let cv2d = null, dispFont = '';
function textW(txt, px) {
  try {
    if (!cv2d) {
      cv2d = document.createElement('canvas').getContext('2d');
      dispFont = getComputedStyle(document.documentElement).getPropertyValue('--f-display') || 'sans-serif';
    }
    cv2d.font = `400 ${px}px ${dispFont}`;
    const w = cv2d.measureText(txt).width;
    if (w > 0) return w;
  } catch (e) {}
  return emOf(txt) * px;
}
function calc(S, W) {
  const padX = 10, padY = 10, gap = 6;
  const fs = clamp(S * 0.43, 11, 13.5), pillH = Math.round(clamp(S * 0.8, 14, 24)), tagH = Math.round(clamp(S * 0.62, 13, 19));
  const zpad = tagH + Math.round(pillH / 2) + 10;
  const total = 2 * (padY + zpad) + 10 * S;
  const wl = Math.round(textW('다섯째 줄', fs) + fs * 1.1), wr = Math.round(textW('넷째 간', fs) + fs * 1.1);
  const x0 = padX + wl + gap, x1 = W - padX - wr - gap;
  return { S, fs, pillH, tagH, zpad, total, wl, wr, x0, x1, padX, padY, gap };
}
function geometry(W, H) {
  let g = null;
  for (let S = 36; S >= 16; S -= 0.5) {
    const c = calc(S, W);
    if (c.total <= H && (c.x1 - c.x0) >= 6.03 * S) { g = c; break; }
  }
  if (!g) g = calc(16, W);
  const S = g.S, h = S / 2, off = Math.max(0, (H - g.total) / 2);
  g.W = W; g.H = H; g.h = h;
  g.yTop = off + g.padY;
  g.y20 = g.yTop + g.zpad;
  g.yOf = p => Math.round(g.y20 + (20 - p) * h);
  g.yBot = g.yOf(0) + g.zpad;
  g.clefX = g.x0 + 0.35 * S;
  g.clefEnd = g.clefX + GL.gClef.bbox[2] * S;
  g.noteX = Math.round((g.clefEnd + 1.83 * S + g.x1 - 1.1 * S) / 2);
  return g;
}

function faceMarkup(S) {
  return `<g class="face" transform="scale(${S.toFixed(2)}) rotate(-14)">` +
    `<g class="eyes open">` +
      `<g transform="translate(-.25 -.07)"><g class="eye"><ellipse class="sclera" rx=".125" ry=".145"/><circle class="pupil" r=".07" cy=".01"/><circle class="shine" cx="-.035" cy="-.05" r=".032"/></g></g>` +
      `<g transform="translate(.25 -.07)"><g class="eye"><ellipse class="sclera" rx=".125" ry=".145"/><circle class="pupil" r=".07" cy=".01"/><circle class="shine" cx="-.035" cy="-.05" r=".032"/></g></g>` +
    `</g>` +
    `<g class="eyes happy"><path d="M-.37 -.03Q-.25 -.2 -.13 -.03"/><path d="M.13 -.03Q.25 -.2 .37 -.03"/></g>` +
    `<ellipse class="blush" cx="-.4" cy=".1" rx=".1" ry=".06"/><ellipse class="blush" cx=".4" cy=".1" rx=".1" ry=".06"/>` +
    `<path class="mouth smile" d="M-.1 .09Q0 .21 .1 .09"/>` +
    `<path class="mouth open" d="M-.12 .07Q0 .31 .12 .07Z"/><ellipse class="tongue" cx="0" cy=".2" rx=".05" ry=".03"/>` +
    `<ellipse class="mouth o" cx="0" cy=".15" rx=".06" ry=".08"/>` +
    `</g>`;
}

function buildStage() {
  const W = Math.round(card.clientWidth), H = Math.round(card.clientHeight);
  if (!W || !H) return;
  const g = geometry(W, H); G = g;
  const { S, h, fs, pillH, tagH, x0, x1, noteX, yOf, gap } = g;
  const hadFocus = document.activeElement && document.activeElement.id === 'note';
  const tfs = Math.max(10.5, fs * 0.92);
  const f1 = n => (+n).toFixed(1);
  let s = '';
  s += `<rect class="fl-zone" x="0" y="0" width="${W}" height="${yOf(14)}"/>`;
  s += `<rect class="fl-staff" x="0" y="${yOf(14)}" width="${W}" height="${yOf(6) - yOf(14)}"/>`;
  s += `<rect class="fl-zone" x="0" y="${yOf(6)}" width="${W}" height="${H - yOf(6)}"/>`;
  const tag = (txt, anchor, yc, left) => {
    const w = Math.round(textW(txt, tfs) + tfs * 1.2), x = left ? anchor : anchor - w;
    return `<g class="tag"><rect x="${f1(x)}" y="${f1(yc - tagH / 2)}" width="${w}" height="${tagH}" rx="${f1(tagH / 2)}"/><text x="${f1(x + w / 2)}" y="${f1(yc + tfs * 0.36)}" text-anchor="middle" style="font-size:${f1(tfs)}px">${txt}</text></g>`;
  };
  const tyU = g.yTop + 2 + tagH / 2, tyL = g.yBot - 2 - tagH / 2, inset = 16;
  s += tag('위쪽 덧줄', inset, tyU, true) + tag('위쪽 덧간', W - inset, tyU, false);
  s += tag('아래쪽 덧줄', inset, tyL, true) + tag('아래쪽 덧간', W - inset, tyL, false);
  s += `<g id="bandg"><rect class="band in" id="band" x="${x0 - 3}" y="-4" width="${x1 - x0 + 6}" height="8" rx="4"/></g>`;
  const lx1 = f1(noteX - (HEAD_W / 2 + 0.4) * S), lx2 = f1(noteX + (HEAD_W / 2 + 0.4) * S);
  for (let p = STAFF_LO; p <= STAFF_HI; p += 2) s += `<line class="stl" x1="${x0}" y1="${yOf(p)}" x2="${x1}" y2="${yOf(p)}"/>`;
  s += `<line class="bar" x1="${x0}" y1="${yOf(14)}" x2="${x0}" y2="${yOf(6)}"/>`;
  s += `<path class="clef" transform="translate(${f1(g.clefX)} ${yOf(8)}) scale(${S.toFixed(2)})" d="${GL.gClef.d}"/>`;
  LEDGER_PS.forEach(p => { s += `<line class="ghost" x1="${lx1}" y1="${yOf(p)}" x2="${lx2}" y2="${yOf(p)}"/>`; });
  LEDGER_PS.forEach(p => { s += `<line class="led" data-p="${p}" x1="${lx1}" y1="${yOf(p)}" x2="${lx2}" y2="${yOf(p)}"/>`; });
  s += `<g class="marks" id="marks"></g>`;
  for (let p = P_MIN; p <= P_MAX; p++) {
    const x = posInfo(p), inS = x.zone === 'staff', txt = inS ? x.short : ORD[x.k];
    const w = Math.round(textW(txt, fs) + fs * 1.1);
    const cx = x.isLine ? x0 - gap - w / 2 : x1 + gap + w / 2;
    s += `<g class="lab ${inS ? 'in' : 'out'}" data-p="${p}" transform="translate(${f1(cx)} ${yOf(p)})"><g class="labin"><rect x="${f1(-w / 2)}" y="${f1(-pillH / 2)}" width="${w}" height="${pillH}" rx="${f1(pillH / 2)}"/><text y="${f1(fs * 0.36)}" text-anchor="middle" style="font-size:${f1(fs)}px">${txt}</text></g></g>`;
  }
  const cw = (0.11 * S).toFixed(1);
  s += `<g id="note" class="note" tabindex="0" role="slider" aria-orientation="vertical" aria-label="음표 자리" aria-valuemin="${P_MIN}" aria-valuemax="${P_MAX}">` +
    `<g class="chev up" transform="translate(0 ${f1(-1.62 * S)})"><path stroke-width="${cw}" d="M${f1(-0.3 * S)} ${f1(0.12 * S)}L0 ${f1(-0.18 * S)}L${f1(0.3 * S)} ${f1(0.12 * S)}"/></g>` +
    `<g class="chev dn" transform="translate(0 ${f1(1.62 * S)})"><path stroke-width="${cw}" d="M${f1(-0.3 * S)} ${f1(-0.12 * S)}L0 ${f1(0.18 * S)}L${f1(0.3 * S)} ${f1(-0.12 * S)}"/></g>` +
    `<circle class="glow" r="${f1(1.14 * S)}"/>` +
    `<g class="squash"><g class="bob"><rect class="stem" rx="${f1(0.06 * S)}" x="0" y="0" width="${f1(0.12 * S)}" height="1"/>` +
    `<path class="head" transform="translate(${f1(-HEAD_W / 2 * S)} 0) scale(${S.toFixed(2)})" d="${GL.noteheadBlack.d}"/>${faceMarkup(S)}</g></g>` +
    `<circle class="hit" r="${Math.max(28, Math.round(1.5 * S))}"/></g>`;
  s += `<g id="fx" pointer-events="none"></g>`;

  svg.classList.add('no-anim');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.innerHTML = s;
  applyStage(posInfo(ST.p));
  if (hadFocus) { try { $('note').focus({ preventScroll: true }); } catch (e) {} }
  if (!ST.hinted) say('저를 위아래로 끌어 보세요!', false, true);
  requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove('no-anim')));
}

function setStem(stem, x, S) {
  const h = S / 2, w = 0.12 * S, len = x.stemHalf * h - 0.168 * S;
  stem.setAttribute('x', (x.stemUp ? HEAD_W / 2 * S - w : -HEAD_W / 2 * S).toFixed(2));
  stem.setAttribute('y', (x.stemUp ? -x.stemHalf * h : 0.168 * S).toFixed(2));
  stem.setAttribute('height', len.toFixed(2));
}
function face() {
  const n = $('note'); if (!n) return;
  const out = ST.p < STAFF_LO || ST.p > STAFF_HI;
  n.dataset.mouth = ST.grab ? 'o' : out ? 'open' : 'smile';
  n.dataset.mood = ST.happy ? 'happy' : '';
}

function applyStage(x) {
  const note = $('note'); if (!note) return;
  const out = x.zone !== 'staff';
  note.classList.toggle('out', out);
  note.classList.toggle('edge-up', x.p === P_MAX);
  note.classList.toggle('edge-dn', x.p === P_MIN);
  note.style.transform = `translate(${G.noteX}px, ${G.yOf(x.p)}px)`;
  setStem(note.querySelector('.stem'), x, G.S);
  svg.querySelectorAll('.led').forEach(l => {
    const q = +l.dataset.p, on = x.ledgers.indexOf(q) !== -1;
    l.classList.toggle('on', on);
    l.classList.toggle('cur', on && q === x.p);
  });
  const band = $('band'), bh = x.isLine ? 9 : Math.round(G.S - 5);
  band.setAttribute('class', 'band ' + (out ? 'out' : 'in'));
  band.setAttribute('height', bh);
  band.setAttribute('y', -bh / 2);
  band.setAttribute('rx', x.isLine ? 4.5 : 9);
  $('bandg').style.transform = `translateY(${G.yOf(x.p)}px)`;
  svg.querySelectorAll('.lab').forEach(l => l.classList.toggle('on', +l.dataset.p === x.p));
  renderMarks(x);
  face();
  note.setAttribute('aria-valuenow', String(x.p));
  note.setAttribute('aria-valuetext', `${x.name}, ${x.solf}`);
}

/* 덧줄도 오선과 같은 간격이라는 눈금 */
function renderMarks(x) {
  const g = $('marks'); if (!g) return;
  if (!x.ledgers.length) { g.classList.remove('on'); return; }
  const seq = (x.zone === 'up' ? [STAFF_HI - 2, STAFF_HI] : [STAFF_LO + 2, STAFF_LO]).concat(x.ledgers);
  const mx = G.noteX - 1.68 * G.S, t = Math.max(3.5, G.S * 0.13);
  let s = '';
  for (let i = 0; i < seq.length - 1; i++) {
    const ya = G.yOf(seq[i]), yb = G.yOf(seq[i + 1]);
    s += `<path class="mk ${i === 0 ? 'st' : 'ld'}" d="M${mx - t} ${ya}H${mx + t}M${mx} ${ya}V${yb}M${mx - t} ${yb}H${mx + t}"/>`;
  }
  g.innerHTML = s;
  g.classList.add('on');
}

/* ---------- 말풍선 ---------- */
let sayT = 0;
function placeBubble() {
  const b = $('bubble'); if (!G) return;
  const bw = b.offsetWidth, bh = b.offsetHeight, ny = G.yOf(ST.p), S = G.S;
  const left = clamp(G.noteX - bw / 2, 8, G.W - bw - 8);
  let top = ny - S * 2.05 - bh - 4, below = false;
  if (top < 6) { top = ny + S * 2.05 + 4; below = true; }
  if (below && top + bh > G.H - 6) top = clamp(ny - S * 2.05 - bh - 4, 6, G.H - bh - 6);
  b.style.left = Math.round(left) + 'px';
  b.style.top = Math.round(top) + 'px';
  b.style.setProperty('--tx', Math.round(clamp(G.noteX - left, 16, bw - 16)) + 'px');
  b.classList.toggle('below', below);
}
function say(msg, out, sticky) {
  const b = $('bubble');
  clearTimeout(sayT);
  b.textContent = msg;
  b.className = 'bubble' + (out ? ' out' : '') + (sticky ? ' hint' : '');
  placeBubble();
  void b.offsetWidth;
  b.classList.add('show');
  if (!sticky) sayT = setTimeout(() => b.classList.remove('show'), 1700);
}
function zoneMsg(prev, x) {
  if (x.p === P_MAX && prev.p !== P_MAX) return ['가장 높은 자리예요!', true];
  if (x.p === P_MIN && prev.p !== P_MIN) return ['가장 낮은 자리예요!', true];
  const out = x.zone !== 'staff';
  if (x.zone !== prev.zone) {
    if (!out) return ['다시 오선 안이에요!', false];
    return x.ledgers.length ? ['덧줄이 생겼어요!', true] : ['오선 밖으로 나왔어요!', true];
  }
  if (!out) return null;
  if (x.ledgers.length > prev.ledgers.length) return prev.ledgers.length ? ['덧줄이 하나 더!', true] : ['덧줄이 생겼어요!', true];
  if (x.ledgers.length < prev.ledgers.length) return x.ledgers.length ? ['덧줄이 하나 줄었어요', true] : ['덧줄 없이도 돼요', true];
  return null;
}

/* ---------- 반짝이 · 떠다니는 ♪ ---------- */
function burst(cx, cy, n, dist) {
  if (reduced()) return;
  const fx = $('fx'); if (!fx) return;
  const cols = ['var(--pink)', 'var(--butter)', 'var(--primary)'];
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.7, d = dist * (0.7 + Math.random() * 0.6), r = 3.2 + Math.random() * 3.2;
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', STAR);
    el.style.fill = cols[i % 3];
    fx.appendChild(el);
    try {
      const an = el.animate([
        { transform: `translate(${cx}px,${cy}px) scale(.2) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${cx + Math.cos(a) * d}px,${cy + Math.sin(a) * d}px) scale(${r}) rotate(120deg)`, opacity: 0 }
      ], { duration: 620 + Math.random() * 180, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
      an.onfinish = () => el.remove();
    } catch (e) { el.remove(); }
  }
}
function floatNote(dx, color) {
  if (reduced()) return;
  const fx = $('fx'); if (!fx || !G) return;
  const bb = GL.noteEighthUp.bbox, sc = G.S * 0.5;
  const ox = -(bb[0] + bb[2]) / 2 * sc, oy = -(bb[1] + bb[3]) / 2 * sc;
  const x = G.noteX + dx, y = G.yOf(ST.p) - G.S * 1.6;
  const el = document.createElementNS(NS, 'path');
  el.setAttribute('d', GL.noteEighthUp.d);
  el.style.fill = color;
  fx.appendChild(el);
  try {
    const an = el.animate([
      { transform: `translate(${x + ox}px,${y + oy}px) scale(${sc * 0.6}) rotate(-8deg)`, opacity: 0 },
      { transform: `translate(${x + ox + dx * 0.3}px,${y + oy - 16}px) scale(${sc}) rotate(6deg)`, opacity: 1, offset: 0.25 },
      { transform: `translate(${x + ox + dx * 0.7}px,${y + oy - 46}px) scale(${sc}) rotate(-6deg)`, opacity: 0 }
    ], { duration: 1100, easing: 'ease-out', fill: 'forwards' });
    an.onfinish = () => el.remove();
  } catch (e) { el.remove(); }
}

/* ---------- 읽기 영역 ---------- */
function explain(x) {
  const n = x.ledgers.length, side = x.zone === 'up' ? '위' : '아래';
  if (x.kind === '줄') return '<b>줄</b> 위의 음이에요. 선이 음표 머리를 가로질러요.';
  if (x.kind === '간') return '<b>간</b>의 음이에요. 선과 선 사이 공간에 놓여요.';
  if (x.kind === '덧줄') return `<b>덧줄</b> 위의 음이에요. 오선과 같은 간격으로 덧줄 ${n}개를 긋고, ${n === 1 ? '그 덧줄이' : '마지막 덧줄이'} 음표 머리를 가로질러요.`;
  if (x.k === 1) return `<b>덧간</b>의 음이에요. 오선과 ${side}쪽 첫째 덧줄 자리 사이라서, 덧줄 없이 오선에 붙여 적어요.`;
  return `<b>덧간</b>의 음이에요. ${ORD[x.k - 1]} 덧줄과 ${ORD[x.k]} 덧줄 자리 사이에 놓여요. 덧줄은 음표 ${x.zone === 'up' ? '아래' : '위'}쪽에만 ${n}개 그어요.`;
}
function reserveExplain() {
  const el = $('ro-exp'); if (!el.clientWidth) return;
  const keep = el.innerHTML;
  el.style.minHeight = '0px';
  let mx = 0;
  for (let p = P_MIN; p <= P_MAX; p++) { el.innerHTML = explain(posInfo(p)); mx = Math.max(mx, el.offsetHeight); }
  el.innerHTML = keep;
  el.style.minHeight = mx + 'px';
}
function readout(x, dir, dist) {
  const out = x.zone !== 'staff', nm = $('ro-name');
  nm.firstElementChild.textContent = x.name;
  nm.classList.toggle('out', out);
  if (dir && !reduced()) {
    try { nm.animate([{ transform: `translateY(${dir > 0 ? 9 : -9}px)`, opacity: 0.25 }, { transform: 'none', opacity: 1 }], { duration: 230, easing: 'cubic-bezier(.2,.9,.3,1.2)' }); } catch (e) {}
  }
  const zt = x.zone === 'staff' ? '오선 안' : x.zone === 'up' ? '오선 위쪽' : '오선 아래쪽';
  $('ro-chips').innerHTML = `<span class="chip${out ? ' out' : ''}">${zt}</span><span class="chip${out ? ' out' : ''}">${x.kind}</span><span class="chip plain">덧줄 ${x.ledgers.length}개</span>`;
  const col = SOLF_COL[x.solf], bd = $('ro-badge');
  bd.style.setProperty('--sc', col[0]);
  bd.style.setProperty('--sg', col[1]);
  $('ro-solf').textContent = x.solf;
  $('ro-letter').textContent = x.letter;
  if (dir && !reduced()) {
    try { bd.animate([{ transform: 'scale(.82) rotate(-8deg)' }, { transform: 'scale(1.06) rotate(3deg)', offset: 0.6 }, { transform: 'none' }], { duration: 300, easing: 'ease-out' }); } catch (e) {}
  }
  const d = $('ro-dir');
  if (dir) {
    d.className = 'dir ' + (dir > 0 ? 'up' : 'dn');
    d.innerHTML = `${dir > 0 ? ARW_UP : ARW_DN}<span>${dist === 1 ? '한 자리' : dist + '자리'} ${dir > 0 ? '위로' : '아래로'} · ${dir > 0 ? '더 높은' : '더 낮은'} 소리</span>`;
  }
  $('ro-exp').innerHTML = explain(x);
  $('up').disabled = x.p >= P_MAX;
  $('down').disabled = x.p <= P_MIN;
}

/* ---------- 움직임 ---------- */
let lookT = 0, happyT = 0;
function look(dir) {
  const n = $('note'); if (!n) return;
  n.style.setProperty('--look', String(dir > 0 ? -0.05 : 0.05));
  clearTimeout(lookT);
  lookT = setTimeout(() => { n.style.setProperty('--look', '0'); }, 650);
}
function squash(dir) {
  if (reduced()) return;
  const el = svg.querySelector('#note .squash'); if (!el) return;
  try {
    el.animate([
      { transform: 'scale(1,1)' },
      { transform: `scale(.9,${dir > 0 ? 1.16 : 1.12})`, offset: 0.3 },
      { transform: 'scale(1.07,.93)', offset: 0.65 },
      { transform: 'scale(1,1)' }
    ], { duration: 340, easing: 'ease-out' });
  } catch (e) {}
}
function flash() {
  if (reduced()) return;
  try { const b = $('band'); if (b) b.animate([{ opacity: 0.35 }, { opacity: 1 }], { duration: 300, easing: 'ease-out' }); } catch (e) {}
}
function stageMove(p, via) {
  p = clampP(p);
  if (p === ST.p) return;
  const prev = posInfo(ST.p), x = posInfo(p), dir = Math.sign(p - ST.p), dist = Math.abs(p - ST.p);
  ST.p = p;
  if (!ST.hinted) { ST.hinted = true; $('bubble').classList.remove('show'); }
  applyStage(x);
  readout(x, dir, dist);
  look(dir);
  squash(dir);
  flash();
  play(x.midi);
  haptic();
  const fresh = x.ledgers.filter(q => prev.ledgers.indexOf(q) === -1);
  fresh.slice(0, 3).forEach(q => burst(G.noteX, G.yOf(q), 6, G.S * 1.3));
  const m = zoneMsg(prev, x);
  if (m) say(m[0], m[1]);
  else if ($('bubble').classList.contains('show')) placeBubble();
  emit('notemove', { source: 'stage', via, direction: dir, from: pub(prev), to: pub(x) });
}
function setGrab(on) {
  ST.grab = on;
  const n = $('note'); if (n) n.classList.toggle('grab', on);
  face();
}
function stageDrop(via) {
  const x = posInfo(ST.p);
  $('live').textContent = `${x.name}, ${x.solf}. ${$('ro-exp').textContent}`;
  ST.happy = true; face();
  clearTimeout(happyT);
  happyT = setTimeout(() => { ST.happy = false; face(); }, 900);
  if (!reduced()) {
    const gl = svg.querySelector('#note .glow');
    try { if (gl) gl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.5)', opacity: 0.2, offset: 0.5 }, { transform: 'scale(1)' }], { duration: 560, easing: 'ease-out' }); } catch (e) {}
  }
  emit('notedrop', { source: 'stage', via, at: pub(x) });
}

/* 드래그 · 탭 · 키보드 */
let drag = null;
function pAtY(y) { return clampP(Math.round(20 - (y - G.y20) / G.h)); }
svg.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  ac();
  const r = svg.getBoundingClientRect(), y = e.clientY - r.top;
  const onNote = !!e.target.closest('#note');
  let off = 0;
  if (onNote) off = y - G.yOf(ST.p);
  else { const p = pAtY(y); if (p !== ST.p) stageMove(p, 'tap'); }
  drag = { id: e.pointerId, off, moved: false, jumped: !onNote };
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  setGrab(true);
});
svg.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const r = svg.getBoundingClientRect();
  const p = pAtY(e.clientY - r.top - drag.off);
  if (p !== ST.p) { drag.moved = true; stageMove(p, 'drag'); }
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  setGrab(false);
  if (!d.moved && !d.jumped) play(posInfo(ST.p).midi);
  stageDrop(d.moved ? 'drag' : 'tap');
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('touchstart', e => { e.preventDefault(); }, { passive: false });
svg.addEventListener('keydown', e => {
  if (!e.target.closest('#note')) return;
  let p = ST.p;
  switch (e.key) {
    case 'ArrowUp': case 'ArrowRight': p += 1; break;
    case 'ArrowDown': case 'ArrowLeft': p -= 1; break;
    case 'PageUp': p += 7; break;
    case 'PageDown': p -= 7; break;
    case 'Home': p = P_MIN; break;
    case 'End': p = P_MAX; break;
    default: return;
  }
  e.preventDefault();
  ac();
  p = clampP(p);
  if (p !== ST.p) { stageMove(p, 'key'); stageDrop('key'); }
});

/* ---------- 설정 · 연결 ---------- */
function applySound() {
  $('snd').setAttribute('aria-pressed', String(SOUND));
  $('snd').setAttribute('aria-label', SOUND ? '소리 켜짐. 누르면 소리를 끕니다' : '소리 꺼짐. 누르면 소리를 켭니다');
  $('snd-wave').style.display = SOUND ? '' : 'none';
  $('snd-x').style.display = SOUND ? 'none' : '';
}
let lastW = 0, lastH = 0, fontT = 0;
function relayout() {
  reserveExplain();
  const W = Math.round(card.clientWidth), H = Math.round(card.clientHeight);
  if (W && H && (W !== lastW || H !== lastH) && !drag) { lastW = W; lastH = H; buildStage(); }
}
/* 글꼴이 늦게 도착하면 글자 폭이 달라지므로 한 번 더 그린다 */
function relayoutFonts() {
  clearTimeout(fontT);
  fontT = setTimeout(() => { if (drag) { relayoutFonts(); return; } lastW = 0; relayout(); }, 60);
}
function bind() {
  $('snd').addEventListener('click', () => {
    SOUND = !SOUND;
    if (!SOUND && voice) { voice.stop(); voice = null; }
    store.set('sound', SOUND);
    applySound();
    if (SOUND) play(posInfo(ST.p).midi, true);
  });
  $('up').addEventListener('click', () => { ac(); stageMove(ST.p + 1, 'button'); stageDrop('button'); });
  $('down').addEventListener('click', () => { ac(); stageMove(ST.p - 1, 'button'); stageDrop('button'); });
  $('listen').addEventListener('click', () => {
    ac();
    const x = posInfo(ST.p);
    play(x.midi, true);
    stageDrop('listen');
    const c = SOLF_COL[x.solf][0];
    floatNote(-G.S * 1.1, c);
    setTimeout(() => floatNote(G.S * 1.1, c), 170);
  });
  let roT = 0;
  const later = () => { if (!roT) roT = requestAnimationFrame(() => { roT = 0; relayout(); }); };
  if (window.ResizeObserver) new ResizeObserver(later).observe(card);
  else window.addEventListener('resize', later);
  if (document.fonts) {
    if (document.fonts.ready) document.fonts.ready.then(relayoutFonts);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', relayoutFonts);
  }
}

function start(data) {
  data = data || {};
  const s = store.get('sound', true);
  SOUND = typeof s === 'boolean' ? s : true;
  if (data.ST && typeof data.ST.p === 'number') { ST.p = clampP(data.ST.p); ST.hinted = !!data.ST.hinted; }
  const bb = GL.noteEighthUp.bbox, dn = $('deco-note');
  dn.setAttribute('viewBox', `${bb[0]} ${bb[1]} ${bb[2] - bb[0]} ${bb[3] - bb[1]}`);
  $('deco-note-p').setAttribute('d', GL.noteEighthUp.d);
  applySound();
  readout(posInfo(ST.p), 0, 0);
  bind();
  relayout();
}

if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
  window.claude.hot.snapshot(() => ({ ST: { p: ST.p, hinted: ST.hinted } }));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
